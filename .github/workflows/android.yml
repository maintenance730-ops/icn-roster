name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key (from repository secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set — test build signed with a temporary key, no release published"
          fi

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        run: cp android/app/build/outputs/apk/release/app-release.apk ICN-Roster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ICN-Roster-apk
          path: ICN-Roster.apk

      - name: Publish release (latest)
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" ICN-Roster.apk \
            --title "ICN Roster APK 1.0.${{ github.run_number }}" \
            --notes "Android app. Download ICN-Roster.apk and install. 안드로이드 앱 — ICN-Roster.apk 받아서 설치." \
            --latest
